<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Game-Log</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <meta name="theme-color" content="#ffffff">
</head>
<body>

<div class="app-container">
    <header class="app-header shadow-sm">
        <div class="container d-flex justify-content-between align-items-center h-100 px-2">
            <div class="score-pill adrian">Adrian <span id="dashWinsA" class="ms-1">0</span></div>
            <div class="timer-display-top" id="timer" onclick="confirmResetTimer()">00:00:00</div>
            <div class="score-pill lea">Lea <span id="dashWinsL" class="ms-1">0</span></div>
        </div>
    </header>

    <main class="content-area container pt-3">
        
        <section id="tab-home" class="app-tab active">
            <div id="no-game-placeholder" class="text-center mt-5 pt-5 animate-fade-in">
                <div class="display-1 text-light mb-3">🎲</div>
                <h4 class="text-muted fw-bold">Keine aktive Partie</h4>
                <p class="text-muted px-4">Wähle ein Spiel aus deiner Sammlung, um zu starten.</p>
                <button class="btn btn-primary rounded-pill px-5 py-2 fw-bold shadow-sm" onclick="switchTab('collection')">Zur Sammlung</button>
            </div>

            <div id="logSection" class="match-center d-none animate-fade-in">
                <div class="text-center mb-3">
                    <span class="badge bg-primary-subtle text-primary rounded-pill text-uppercase px-3 py-2" id="activeGameNameDisplay">Spielname</span>
                </div>

                <div class="scoreboard-main shadow-sm border-0">
                    <div class="score-column adrian">
                        <label>ADRIAN</label>
                        <div class="big-score" id="sum_adrian">0</div>
                        <input type="number" id="score_adrian" class="score-input-large" placeholder="+ Pkt" inputmode="numeric">
                    </div>
                    <div class="score-vs">VS</div>
                    <div class="score-column lea">
                        <label>LEA</label>
                        <div class="big-score" id="sum_lea">0</div>
                        <input type="number" id="score_lea" class="score-input-large" placeholder="+ Pkt" inputmode="numeric">
                    </div>
                </div>

                <button class="btn btn-primary w-100 btn-xl rounded-4 fw-bold shadow-sm mb-3" onclick="nextRound()">RUNDE EINTRAGEN</button>
                <div id="roundPreview" class="round-history-chips mb-4"></div>

                <div class="action-card shadow-sm p-3 mb-4 border-0 bg-white rounded-4">
                    <select id="winner_id" class="form-select border-0 fw-bold mb-3 bg-light rounded-3">
                        <option value="1">🏆 Adrian hat gewonnen</option>
                        <option value="2">🏆 Lea hat gewonnen</option>
                        <option value="0">⚪ Unentschieden</option>
                    </select>
                    <div class="d-flex gap-2">
                        <button class="btn btn-light flex-grow-1 rounded-3 fw-bold border-0" onclick="document.getElementById('photo').click()">📸 Foto</button>
                        <button class="btn btn-light flex-grow-1 rounded-3 fw-bold border-0" onclick="toggleComment()">📝 Notiz</button>
                    </div>
                    <input type="file" id="photo" class="d-none" accept="image/*" capture="camera">
                    <textarea id="comment" class="form-control border-0 mt-3 bg-light d-none" rows="2" placeholder="Besonderer Moment?"></textarea>
                </div>

                <button class="btn btn-success w-100 btn-lg rounded-4 fw-bold shadow mb-5" onclick="saveSession()">PARTIE SPEICHERN</button>
            </div>
        </section>

        <section id="tab-collection" class="app-tab">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h3 class="fw-bold m-0">Sammlung</h3>
                <button class="btn btn-primary rounded-pill btn-sm px-3" onclick="toggleSearch()">+ Hinzufügen</button>
            </div>
            
            <div class="collapse mb-4" id="searchCol">
                <div class="input-group shadow-sm rounded-pill overflow-hidden">
                    <input type="text" id="searchInput" class="form-control border-0 px-4" placeholder="BGG Suche...">
                    <button class="btn btn-primary px-3" onclick="searchBGG()">🔍</button>
                </div>
                <div id="searchResults" class="mt-2"></div>
            </div>

            <div id="collectionList" class="list-group list-group-custom"></div>
        </section>

        <section id="tab-history" class="app-tab">
            <h3 class="fw-bold mb-4">Verlauf</h3>
            <div class="search-bar mb-4">
                <input type="text" id="historyFilter" class="form-control rounded-pill border-0 shadow-sm px-4" placeholder="Nach Spiel filtern..." onkeyup="filterHistory()">
            </div>
            <div id="historyList" class="list-group list-group-custom"></div>
        </section>
    </main>

    <nav class="bottom-nav">
        <a href="javascript:void(0)" class="nav-item active" id="nav-home" onclick="switchTab('home')">
            <span class="icon">🎲</span><span class="label">Spiel</span>
        </a>
        <a href="javascript:void(0)" class="nav-item" id="nav-collection" onclick="switchTab('collection')">
            <span class="icon">📚</span><span class="label">Sammlung</span>
        </a>
        <a href="javascript:void(0)" class="nav-item" id="nav-history" onclick="switchTab('history')">
            <span class="icon">📜</span><span class="label">Verlauf</span>
        </a>
    </nav>
</div>

<div class="modal fade" id="gameStatsModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 rounded-5 shadow-lg">
            <div class="modal-header border-0">
                <h5 class="modal-title fw-bold" id="statsGameName">Stats</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body pb-4">
                <div class="row text-center mb-4 bg-light mx-1 py-3 rounded-4">
                    <div class="col"><small class="text-muted d-block x-small">ADRIAN</small><h2 class="fw-bold text-primary mb-0" id="statsWinsA">0</h2></div>
                    <div class="col-auto d-flex align-items-center text-muted">vs</div>
                    <div class="col"><small class="text-muted d-block x-small">LEA</small><h2 class="fw-bold text-danger mb-0" id="statsWinsL">0</h2></div>
                </div>
                <h6 class="fw-bold small text-muted text-uppercase mb-2 px-1">Head-to-Head</h6>
                <div id="statsHistoryList" class="list-group list-group-flush mb-4"></div>
                <button class="btn btn-primary w-100 btn-xl rounded-4 fw-bold shadow" id="startGameBtn">PARTIE STARTEN</button>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="detailModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 rounded-5 shadow-lg overflow-hidden">
            <div id="modalImageContainer" class="bg-light"></div>
            <div class="modal-header border-0">
                <div>
                    <h5 class="modal-title fw-bold mb-0" id="modalGameName">Details</h5>
                    <small id="modalFullDate" class="text-muted small"></small>
                </div>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body pt-0">
                <div class="d-flex gap-2 mb-3">
                    <span id="modalDuration" class="badge rounded-pill bg-primary-subtle text-primary"></span>
                    <span id="modalStartTime" class="badge rounded-pill bg-light text-dark border"></span>
                </div>
                <div id="modalScores"></div>
                <div id="modalCommentBox" class="p-3 bg-light rounded-4 mt-3 d-none">
                    <small class="text-muted d-block mb-1 text-uppercase fw-bold x-small">Notiz</small>
                    <div id="modalComment" class="italic small"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="app.js"></script>
</body>
</html>
